<!doctype html>
<html lang="en" class="documentation-page">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="{{root}}favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap">
<meta name="theme-color" content="#050910">
<link rel="stylesheet" href="{{root}}assets/site-chrome.css">
<link rel="stylesheet" href="{{root}}assets/site.css">
<script src="{{root}}assets/site.js" defer></script>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
{{header}}
{{docsNav}}
<div class="container docs-wrap">
{{crumbs}}
  <div class="page{{layoutClass}}">
{{toc}}
    <main id="content" class="prose">
{{content}}
    </main>
  </div>
</div>
{{footer}}
{{scripts}}
</body>
</html>
